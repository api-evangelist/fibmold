aid: fibmold
name: Fibmold
description: 'Fibmold is an eco-friendly molded-fiber packaging manufacturer building sustainable,
  plastic-free alternatives to rigid single-use plastic packaging. Its products are thermoformed
  from natural fibres such as bagasse, bamboo, and hard/soft wood pulp collected from farms,
  forests, and agro-processing units, then upcycled into compostable and recyclable packaging.
  Applications span food-service packaging, customised industrial solutions, fibre-based dosing
  scoops, aviation casseroles, cosmetic inserts, pharma injectable trays, chocolate trays, and
  noodle cups. Fibmold also runs the Primo by Fibmold retail storefront and builds manufacturing
  eco-systems and material-science innovation to scale sustainable packaging on the supply side.
  Backed by Accel.'
